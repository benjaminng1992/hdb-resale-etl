[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdb-etl"
version = "0.1.0"
description = "HDB resale flat prices ETL for Jan 2012 – Dec 2016"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
  "nbformat>=5.10.0",
  "nbclient>=0.10.0",
  "matplotlib>=3.8.0",
  "pillow>=10.0.0",
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
